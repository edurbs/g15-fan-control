# /etc/g15-fan-control.conf
# Fan curve for the Dell G15 5530 via the native alienware-wmi AWCC boost.
# Read by /usr/local/sbin/g15-fan-control (systemd: g15-fan-control.service).
#
# boost scale: 0 = BIOS controls the fan ... 100 = ~max (~3600 rpm CPU / ~3600 video)
# Measured on THIS machine (at ~66C load):
#     boost 0 -> ~1830 rpm    boost 30 -> ~2000 rpm
#     boost 60 -> ~2766 rpm   boost 100 -> ~3594 rpm
#
# >>> EDIT THE CURVE LINE TO TUNE YOUR FAN BEHAVIOUR <<<
# Format: "tempC:boost" pairs, space-separated, temps ASCENDING.
# Fans ramp LINEARLY between points. boost=0 means "let the BIOS decide"
# (so you're never quieter/slower than the firmware's balanced curve).
#
# Cooler keyboard  -> raise the boosts (e.g. 65:55 instead of 65:40).
# Quieter          -> lower the boosts, or start ramping later (55:0...).
CURVE="45:0 50:10 55:20 60:30 65:40 70:52 76:66 82:82 88:100"

# At/above this temperature, force BOTH fans to max (100). Safety net.
EMERGENCY_TEMP=88

# Hard ceiling for the boost value.
MAX_BOOST=100

# Seconds between temperature reads (lower = more responsive).
INTERVAL=3

# Factor GPU temperature into the Video fan (fan2). 1=yes (gaming), 0=CPU only.
CONTROL_GPU=1

# Refresh GPU temp only every N loops (nvidia-smi is relatively heavy).
GPU_REFRESH_EVERY=3

# Snap boost to multiples of this to avoid micro-jitter (0 = no snapping).
SMOOTH_STEP=5
